<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tem treo sản phẩm 30×50mm — Seleen</title>
    <script src="https://cdn.jsdelivr.net/npm/bwip-js@3.0.4/dist/bwip-js-min.js"></script>
    <style>
        @page { size: 30mm 50mm; margin: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 0; display: flex; justify-content: center;
            background: #f4f4f4; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
        }
        .label {
            width: 30mm; height: 50mm; background: white; box-sizing: border-box;
            padding: 0.8mm 1mm; overflow: hidden;
            display: flex; flex-direction: column;
        }

        /* --- Hàng trên: model + size cạnh nhau --- */
        .row-top { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 1mm; }
        .model-sku { font-size: 14pt; font-weight: 800; line-height: 1; letter-spacing: -0.3mm; white-space: nowrap; }
        .size-box {
            flex: none; background: black !important; color: white !important;
            min-width: 7mm; height: 6.6mm; padding: 0 0.5mm;
            display: flex; justify-content: center; align-items: center;
            font-size: 12.5pt; font-weight: 900;
            -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important;
        }

        .divider { flex: none; width: 80%; border-top: 0.6pt dashed black; margin: 1.2mm auto; }
        .instruction { flex: 1; min-height: 0; font-size: 5.6pt; line-height: 1.3; text-align: left; overflow: hidden; }

        /* --- Hàng dưới: cột chữ (trái, hẹp) + QR (phải, to) ---
           QR thay Code128: SKU 16-17 ký tự khiến Code128 nén vào tem 30mm
           quá mỏng (~0.15mm/vạch, dưới ngưỡng in rõ ~0.19-0.25mm). QR ở
           cùng diện tích cho module ~0.2mm — quét được, đã test thực tế. */
        .bottom-row { flex: none; display: flex; align-items: flex-end; gap: 3.6mm; margin-top: 1mm; }
        .info-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.2mm; overflow: hidden; }
        .price { font-size: 8.5pt; font-weight: 700; display: flex; align-items: baseline; line-height: 1; white-space: nowrap; margin-bottom: 0.3mm; }
        .vnd { font-size: 3.8pt; font-weight: 400; margin-left: 0.5px; }
        .batch { font-size: 4.4pt; font-weight: 400; line-height: 1.05; word-break: break-all; }
        .variant-line { font-size: 4.8pt; font-style: italic; font-weight: 600; line-height: 1; }
        .time-line { font-size: 4.2pt; font-style: italic; font-weight: 400; line-height: 1; }

        /* margin-bottom thêm lề dưới cho QR, tránh máy in xén mất viền khiến không quét được */
        .qr-col { flex: none; margin-bottom: 0.6mm; }
        #qrcode { display: block; width: 11mm; height: 11mm; }

        @media print {
            body { background: none; width: 30mm; height: 50mm; }
            .size-box { background-color: black !important; -webkit-print-color-adjust: exact; }
            #qrcode { display: block; }
        }
    </style>
</head>
<body>

<div class="label">
    <div class="row-top">
        <div class="model-sku" id="model-sku">WD0205</div>
        <div class="size-box" id="size">XL</div>
    </div>

    <div class="divider"></div>
    <div class="instruction" id="instruction">
        - Vui lòng phơi sản phẩm dưới bóng mát.<br>
        - Tránh tiếp xúc với ánh nắng trực tiếp.<br>
        - Bảo quản sản phẩm ở nơi khô ráo và thoáng mát
    </div>

    <div class="bottom-row">
        <div class="info-col">
            <div class="price"><span id="price-value">1.000.300</span></div>
            <div class="batch" id="batch">SE-260330-0202-L122-FL3</div>
            <div class="variant-line" id="variant">K124 - Đen</div>
            <div class="time-line" id="current-time"></div>
        </div>
        <div class="qr-col"><canvas id="qrcode"></canvas></div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    if (params.has('model-sku')) document.getElementById('model-sku').innerText = params.get('model-sku');
    if (params.has('size')) document.getElementById('size').innerText = params.get('size');
    if (params.has('batch')) document.getElementById('batch').innerText = params.get('batch');
    if (params.has('instruction')) document.getElementById('instruction').innerHTML = params.get('instruction').replace(/\n/g, '<br>');

    const rawPrice = params.get('price') || "1000300";
    document.getElementById('price-value').innerText = Number(rawPrice).toLocaleString('vi-VN');

    const vn = new Date(Date.now() + 7 * 3600 * 1000);
    document.getElementById('current-time').innerText = vn.toISOString().slice(0, 16).replace('T', ' ');

    const variantCode = params.get('variant') || "K124 - Đen";
    document.getElementById('variant').innerText = variantCode;

    // QR: mặc định lấy mã SKU để khớp với công cụ kiểm đóng hàng (packing-verify).
    // Field 'qr-code' vẫn được nhận để tương thích ngược với hệ thống gọi cũ.
    const skuValue = params.get('qr-code') || params.get('sku') || "SE_WD0205_K124_XL";
    try {
        bwipjs.toCanvas('qrcode', { bcid: 'qrcode', text: skuValue, scale: 6, eclevel: 'M', includetext: false });
    } catch (e) { console.error(e); }
</script>

</body>
</html>
